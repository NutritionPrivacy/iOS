name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: NutritionPrivacy.xcodeproj
  SCHEME: NutritionPrivacy
  SIMULATOR_NAME: iPhone 17 Pro
  DERIVED_DATA_PATH: .build/ci-derived-data
  PACKAGE_RESOLVED_PATH: NutritionPrivacy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  SPM_CACHE_VERSION: v2
  XCODE_VERSION: "26.0"

jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache SPM dependency build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/SourcePackages
            ${{ env.DERIVED_DATA_PATH }}/Build/Products
            ${{ env.DERIVED_DATA_PATH }}/Build/Intermediates.noindex
            ${{ env.DERIVED_DATA_PATH }}/ModuleCache.noindex
            ${{ env.DERIVED_DATA_PATH }}/SDKStatCaches.noindex
          key: spm-artifacts-${{ env.SPM_CACHE_VERSION }}-${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles(env.PACKAGE_RESOLVED_PATH, 'NutritionPrivacy.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-artifacts-${{ env.SPM_CACHE_VERSION }}-${{ runner.os }}-xcode-${{ env.XCODE_VERSION }}-

      - name: Remove project artifacts from restored SPM cache
        shell: bash
        run: |
          rm -rf \
            "$DERIVED_DATA_PATH/Build/Intermediates.noindex/$SCHEME.build" \
            "$DERIVED_DATA_PATH/Build/Intermediates.noindex/${SCHEME}Tests.build"

          find "$DERIVED_DATA_PATH/Build/Products" \
            \( \
              -name "$SCHEME.app" \
              -o -name "$SCHEME.app.dSYM" \
              -o -name "$SCHEME.swiftmodule" \
              -o -name "${SCHEME}Tests.xctest" \
              -o -name "${SCHEME}Tests.xctest.dSYM" \
              -o -name "${SCHEME}Tests.swiftmodule" \
            \) \
            -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -skipMacroValidation \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME,OS=latest" \
            | xcbeautify --renderer github-actions

      - name: Remove project artifacts from SPM cache
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$DERIVED_DATA_PATH/Build/Intermediates.noindex/$SCHEME.build" \
            "$DERIVED_DATA_PATH/Build/Intermediates.noindex/${SCHEME}Tests.build"

          find "$DERIVED_DATA_PATH/Build/Products" \
            \( \
              -name "$SCHEME.app" \
              -o -name "$SCHEME.app.dSYM" \
              -o -name "$SCHEME.swiftmodule" \
              -o -name "${SCHEME}Tests.xctest" \
              -o -name "${SCHEME}Tests.xctest.dSYM" \
              -o -name "${SCHEME}Tests.swiftmodule" \
            \) \
            -prune -exec rm -rf {} + 2>/dev/null || true
